<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Simulation | BrainSignal Simulator</title>

    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>

    <header class="topbar">

        <div class="brand">
            BrainSignal
            <span>Simulator</span>
        </div>

        <nav>
            <a href="/">Dashboard</a>
            <a href="/static/dynamics.html">Simulation</a>
            <a href="/static/ann.html">ANN</a>
            <a href="/static/snn.html">SNN</a>
        </nav>

    </header>


    <main class="page">

        <div class="page-header">

            <div>
                <span class="panel-label">
                    SIMULATION
                </span>

                <h1>Neural Dynamics</h1>

                <p>
                    Configure and run a neural dynamics simulation.
                </p>
            </div>

        </div>


        <section class="dashboard-grid">

            <!-- Simulation settings -->

            <div class="panel">

                <div class="panel-header">

                    <div>
                        <span class="panel-label">
                            CONFIGURATION
                        </span>

                        <h2>Simulation settings</h2>
                    </div>

                </div>


                <div class="form-group">

                    <label for="model">
                        Model
                    </label>

                    <select id="model">

                        <option value="lorenz">
                            Lorenz
                        </option>

                        <option value="lif">
                            LIF Neuron
                        </option>

                        <option value="izhikevich">
                            Izhikevich
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="solver">
                        Solver
                    </label>

                    <select id="solver">

                        <option value="euler">
                            Euler
                        </option>

                        <option value="rk4">
                            RK4
                        </option>

                        <option value="verlet">
                            Verlet
                        </option>

                        <option value="leapfrog">
                            Leapfrog
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="T">
                        Simulation time (T)
                    </label>

                    <input
                        id="T"
                        type="number"
                        value="10"
                        step="0.1"
                    >

                </div>


                <div class="form-group">

                    <label for="dt">
                        Time step (dt)
                    </label>

                    <input
                        id="dt"
                        type="number"
                        value="0.01"
                        step="0.001"
                    >

                </div>


                <button
                    class="primary-button"
                    onclick="runSimulation()"
                >
                    Run Simulation
                </button>

            </div>


            <!-- Simulation information -->

            <div class="panel">

                <div class="panel-header">

                    <div>
                        <span class="panel-label">
                            STATUS
                        </span>

                        <h2>Simulation info</h2>
                    </div>

                </div>


                <div id="spikes">

                    No simulation data yet.

                </div>

            </div>

        </section>


        <!-- Chart -->

        <section class="panel large-panel">

            <div class="panel-header">

                <div>
                    <span class="panel-label">
                        SIGNAL
                    </span>

                    <h2>Simulation result</h2>
                </div>

            </div>


            <div class="chart-container">

                <canvas id="chart"></canvas>

            </div>

        </section>


    </main>


    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script src="/static/js/simulation.js"></script>

</body>

</html>
